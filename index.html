<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kaiju Studios — Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 700px;
    }

    .logo {
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      margin-bottom: 1rem;
    }

    p {
      color: #b3b3b3;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.5rem;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    .button:hover {
      background: #ffffff;
      color: #0a0a0a;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #666666;
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body>

  <main>
    <div class="logo">Kaiju Studios</div>

    <h1>Something is coming.</h1>

    <p>
      We're currently building something new.
      In the meantime, explore the work of our founder,
      Haseeb Amin.
    </p>

    <a
      href="https://www.haseebamin.com"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
    >
      Explore Haseeb Amin
    </a>
  </main>

  <footer>
    © 2026 Kaiju Studios
  </footer>

</body>
</html>
